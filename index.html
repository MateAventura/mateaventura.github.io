<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#6c4ad6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MateAventura">
<title>MateAventura · problemas de mates</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#7b5cff;--c2:#4f3bd1;--soft:#efeaff;--bg:#f7f4ff;--card:#fff;--ink:#22213a;--mut:#6d6b85;--line:#e6e1f5;--ok:#1fae6b;--okbg:#e2f8ec;--bad:#e5484d;--badbg:#fdecec;--gold:#ffb703;--sh:0 6px 0 rgba(40,20,120,.12),0 10px 24px rgba(40,20,120,.10)}
body[data-theme=oceano]{--c1:#22b8f0;--c2:#0a6fc2;--soft:#e3f5ff;--bg:#f2faff}
body[data-theme=bosque]{--c1:#3fbf6a;--c2:#1d7a45;--soft:#e4f7ea;--bg:#f3fbf5}
body[data-theme=atardecer]{--c1:#ff8a4c;--c2:#e2366b;--soft:#ffece3;--bg:#fff7f2}
body[data-theme=noche]{--c1:#6f7cff;--c2:#28307a;--soft:#2a2f55;--bg:#151833;--card:#20244a;--ink:#f1f1ff;--mut:#a9acd6;--line:#343a6e;--okbg:#173a2c;--badbg:#3d1d24}
body[data-theme=chuches]{--c1:#ff6fb5;--c2:#a24bff;--soft:#ffe8f5;--bg:#fff5fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;overscroll-behavior:none}
h1,h2,h3,.big{font-family:'Baloo 2',Nunito,sans-serif;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.top .in{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.who b{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:15px;white-space:nowrap;display:flex;gap:4px;align-items:center}
.icbtn{background:rgba(255,255,255,.2);border-radius:12px;width:36px;height:36px;font-size:18px;display:grid;place-items:center}
/* avatar */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;background:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.av .e{line-height:1}
.av .acc{position:absolute;top:-22%;right:-14%;line-height:1;transform:rotate(14deg)}
.av.s{width:40px;height:40px}.av.s .e{font-size:26px}.av.s .acc{font-size:18px}
.av.m{width:84px;height:84px}.av.m .e{font-size:54px}.av.m .acc{font-size:34px}
.av.l{width:120px;height:120px}.av.l .e{font-size:78px}.av.l .acc{font-size:46px}
/* navegación inferior */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:720px;margin:auto;display:flex;justify-content:space-around}
.nav button{background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:var(--mut);padding:4px 8px;border-radius:12px;min-width:62px}
.nav button span{font-size:24px;line-height:1.1}
.nav button.on{color:var(--c2);background:var(--soft)}
body[data-theme=noche] .nav button.on{color:#fff}
/* tarjetas */
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--sh);margin:16px 0}
.btn{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;font-weight:800;font-size:18px;padding:13px 22px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sec{background:var(--soft);color:var(--c2);box-shadow:0 5px 0 var(--line)}
body[data-theme=noche] .btn.sec{color:#fff}
.btn.gold{background:linear-gradient(180deg,#ffd166,#f4a100);color:#5a3a00}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.small{font-size:14px}
.center{text-align:center}
/* mapa */
.hello{display:flex;gap:14px;align-items:center;margin-top:16px}
.bubble{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);position:relative;font-weight:700;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:22px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.world{border-radius:26px;padding:16px 16px 18px;margin:18px 0;color:#fff;box-shadow:var(--sh);position:relative;overflow:hidden}
.world h2{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.world .wdesc{opacity:.92;font-weight:700;font-size:15px}
.world .wemo{position:absolute;right:10px;top:4px;font-size:64px;opacity:.9;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.world.locked{filter:grayscale(.85);opacity:.7}
.path{display:flex;justify-content:space-between;margin-top:14px;gap:6px}
.node{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--ink);font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-weight:800;font-size:24px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative;flex:0 0 auto}
.node:nth-child(even){margin-top:22px}
.node.boss{border:4px solid var(--gold)}
.node.lock{background:rgba(255,255,255,.35);color:#fff;box-shadow:none;font-size:20px}
.node.cur{animation:pulse 1.4s infinite}
.node .st{position:absolute;bottom:-17px;font-size:12px;letter-spacing:-2px;white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.daily{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ffd166,#ff9f1c);color:#4a2c00;border-radius:22px;padding:14px 16px;box-shadow:var(--sh);margin-top:16px;width:100%;text-align:left}
.daily .big{font-size:22px}
/* juego */
.ptop{display:flex;align-items:center;gap:10px;margin-top:14px}
.dots{display:flex;gap:6px;flex:1}
.dot{flex:1;height:12px;border-radius:9px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.ko{background:var(--bad)}.dot.now{background:var(--c1);animation:pulse 1.4s infinite}
.lvtitle{font-weight:800;color:var(--mut);font-size:14px;margin-top:6px}
.prob{font-size:21px;font-weight:700;line-height:1.5}
.prob .q{display:block;margin-top:8px;color:var(--c2)}
body[data-theme=noche] .prob .q{color:#c9ccff}
.prob .q.hl{background:#fff3b0;border-radius:8px;padding:2px 6px;color:#5a3a00}
.prob mark{background:none;color:inherit}
.prob.showdata mark{background:#fff3b0;color:#5a3a00;border-radius:6px;padding:0 4px;box-shadow:0 0 0 2px #ffd166}
.fig{display:flex;justify-content:center;margin-top:10px}
.fig svg{max-width:100%;height:auto}
.say{background:var(--soft);border-radius:12px;width:44px;height:44px;font-size:22px;float:right;margin:0 0 6px 10px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.op{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:40px;font-weight:800;background:var(--card);border-radius:18px;padding:6px 0;box-shadow:0 5px 0 var(--line);border:3px solid var(--line);color:var(--c2)}
.op small{display:block;font-family:Nunito;font-size:12px;color:var(--mut);margin-top:-6px}
.op.no{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.op.yes{border-color:var(--ok);background:var(--okbg)}
.ansbox{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 12px}
.disp{min-width:160px;font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:40px;font-weight:800;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:2px 16px;min-height:66px}
.disp.no{border-color:var(--bad);animation:shake .4s}.disp.yes{border-color:var(--ok);background:var(--okbg)}
.unit{font-weight:800;font-size:20px;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:auto}
.kp button{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:28px;font-weight:800;background:var(--card);border-radius:16px;padding:6px 0;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.kp button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:28px;font-weight:800;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 5px 0 var(--line)}
.choice.no{border-color:var(--bad);background:var(--badbg);animation:shake .4s}.choice.yes{border-color:var(--ok);background:var(--okbg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.acts{display:flex;gap:10px;margin-top:14px}
.acts .btn{flex:1}
.hints{margin-top:12px}
.hint{background:#fff8d6;color:#4f3b00;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;border-left:6px solid #ffd166;animation:pop .3s}
.hint b{color:#9a6500}
.sol{background:var(--okbg);border-radius:16px;padding:12px 14px;margin-top:12px;border-left:6px solid var(--ok);animation:pop .3s}
.sol.bad{background:var(--badbg);border-left-color:var(--bad)}
.calc{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:22px;font-weight:700}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.steps4 div{background:var(--soft);border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;font-weight:800;color:var(--mut)}
.steps4 div.on{background:var(--c1);color:#fff}
.steps4 div span{display:block;font-size:20px}
.mascot{display:flex;gap:10px;align-items:center;margin-top:12px}
.mascot .bubble{font-size:17px}
.bounce{animation:bounce .6s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.coinfly{position:fixed;z-index:60;font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #7a4b00;pointer-events:none;animation:fly 1s forwards}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{transform:translateY(-120px) scale(1);opacity:0}}
/* final de nivel */
.stars{display:flex;justify-content:center;gap:8px;font-size:62px;margin:10px 0}
.stars span{filter:grayscale(1);opacity:.3;transform:scale(.6)}
.stars span.on{filter:none;opacity:1;animation:starIn .5s forwards}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.res{display:flex;justify-content:center;gap:6px;font-size:28px;margin:8px 0}
/* logros y tienda */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh)}
.badge .i{font-size:46px;line-height:1.2}
.badge.off .i{filter:grayscale(1);opacity:.3}
.badge b{display:block;font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:17px}
.badge.off b{color:var(--mut)}
.badge p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin:14px 0;overflow-x:auto}
.tabs button{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.tabs button.on{background:var(--c1);color:#fff}
.item{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;align-items:center}
.item .i{font-size:50px;line-height:1.2}
.item .sw{width:60px;height:60px;border-radius:50%}
.item .btn{font-size:15px;padding:8px 12px;width:100%}
/* modales */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,10,60,.55);display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal .card{max-width:380px;width:100%;text-align:center;animation:pop .35s}
@keyframes fade{from{opacity:0}}
.bigemo{font-size:80px;line-height:1.1;animation:bounce 1s infinite}
input.txt{font:inherit;font-size:20px;font-weight:700;padding:12px 14px;border-radius:14px;border:3px solid var(--line);width:100%;background:var(--card);color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pick button{font-size:42px;width:70px;height:70px;border-radius:50%;background:var(--soft);border:3px solid transparent}
.pick button.on{border-color:var(--c1);background:var(--card);transform:scale(1.08)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.h2{font-size:28px;margin-top:18px}
.tag{display:inline-block;background:var(--soft);color:var(--c2);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:800}
.wlearn{margin-top:10px;background:rgba(255,255,255,.25);color:#fff;font-weight:800;border-radius:12px;padding:6px 12px;font-size:14px}
.lbox{background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:10px}
.lbox.ex{background:#fff8d6;color:#4f3b00}.lbox.why{background:var(--okbg)}
.stuckbtn{display:block;width:100%;margin-top:14px;background:var(--card);border:3px dashed var(--c1);color:var(--c2);font-weight:800;font-size:17px;border-radius:16px;padding:10px}
body[data-theme=noche] .stuckbtn{color:#fff}
.stuck{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.stuck button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:26px;border:2px solid transparent}
.stuck button:active{border-color:var(--c1)}
.stuck button span{font-size:16px;line-height:1.25}.stuck small{color:var(--mut);font-weight:600}
.tree div{background:var(--soft);border-radius:12px;padding:8px 10px;margin-top:6px;display:flex;gap:10px;align-items:center}
.opb{font-family:'Baloo 2',Nunito,system-ui,sans-serif;font-size:28px;font-weight:800;color:var(--c2);min-width:26px;text-align:center}
.modal .card{max-height:88vh;overflow:auto}
.msgday{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:linear-gradient(135deg,#ffe3ec,#ffd0df);color:#6b1238;border-radius:22px;padding:12px 16px;box-shadow:var(--sh);margin-top:14px}
.letter{background:#fff8f0;color:#4a2a1a;border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;border:2px dashed #ffb3c6;margin-top:6px}
.letter p{font-family:'Baloo 2',Nunito,sans-serif;font-size:22px;line-height:1.3;margin:8px 0;color:#b0275e}
.letter .sign{text-align:right;font-size:15px}
.firma{text-align:center;font-size:12px;color:var(--mut);font-weight:700;opacity:.8;margin:18px 0 0}
</style>
</head>
<body data-theme="morado">
<div id="top"></div>
<div id="app" class="wrap"></div>
<div id="nav"></div>
<div id="modal"></div>
<canvas id="fx"></canvas>

<script>
/*GEN-START*/
// ---------- utilidades ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd2=x=>Math.round(x*100)/100;
const fmt=x=>{x=rnd2(x);return x.toLocaleString('es-ES',{maximumFractionDigits:2})};
const eur=c=>(c/100).toLocaleString('es-ES',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const hm=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
const NOMBRES=['Lucía','Mateo','Sara','Hugo','Martina','Leo','Daniela','Pablo','Valeria','Álvaro','Carmen','Marcos','Noa','Iker','Alba','Daniel','Julia','Adrián','Paula','Manuel','Vega','Bruno'];
let PLAYER='';
const N=()=>(PLAYER&&Math.random()<.15)?PLAYER:pick(NOMBRES);
const N2=()=>{const a=N();let b;do{b=pick(NOMBRES)}while(b===a);return [a,b]};
const OPF={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,'÷':(a,b)=>a/b};
// problema de un paso: plantilla => [enunciado, pregunta, unidad, plan, x?, y?]
function one(tpl,a,b,op){const r=tpl(a,b,N());const x=r[4]??a,y=r[5]??b;const res=rnd2(OPF[op](x,y));
  return {t:r[0],q:r[1],u:r[2],p:r[3],op,c:[[`${fmt(x)} ${op} ${fmt(y)}`,res]],a:res}}
function uniqChoices(ans,wrongs){const s=[ans];for(const w of wrongs){if(!s.includes(w)&&s.length<4)s.push(w)}return shuffle(s)}

// ---------- figuras ----------
function figRect(l,w,u,col){const s=Math.min(190/l,100/w),W=l*s,H=w*s,x=(270-W)/2,y=14;
  return `<svg viewBox="0 0 270 ${H+56}" width="270"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="4" fill="${col||'#c9f2d6'}" stroke="#2f7d4f" stroke-width="3"/>
  <text x="135" y="${y+H+26}" text-anchor="middle" font-size="17" font-weight="800" fill="currentColor">${fmt(l)} ${u}</text>
  <text x="${x+W+8}" y="${y+H/2+6}" font-size="17" font-weight="800" fill="currentColor">${fmt(w)} ${u}</text></svg>`}
function figTri(b,h,u){const s=Math.min(190/b,110/h),W=b*s,H=h*s,x=(270-W)/2,y=12,ax=x+W*.35;
  return `<svg viewBox="0 0 270 ${H+52}" width="270"><polygon points="${x},${y+H} ${x+W},${y+H} ${ax},${y}" fill="#ffe1a8" stroke="#c77d00" stroke-width="3"/>
  <line x1="${ax}" y1="${y}" x2="${ax}" y2="${y+H}" stroke="#c77d00" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="135" y="${y+H+26}" text-anchor="middle" font-size="17" font-weight="800" fill="currentColor">base ${fmt(b)} ${u}</text>
  <text x="${ax+6}" y="${y+H/2+6}" font-size="16" font-weight="800" fill="currentColor">altura ${fmt(h)} ${u}</text></svg>`}
function figL(a,b,c,d){const s=Math.min(200/(a+c),110/Math.max(b,d)),x=20,base=14+Math.max(b,d)*s;
  return `<svg viewBox="0 0 270 ${base+36}" width="270"><rect x="${x}" y="${base-b*s}" width="${a*s}" height="${b*s}" fill="#c9e4ff" stroke="#1f6fb2" stroke-width="3"/>
  <rect x="${x+a*s}" y="${base-d*s}" width="${c*s}" height="${d*s}" fill="#ffd6e7" stroke="#b2306a" stroke-width="3"/>
  <text x="${x+a*s/2}" y="${base+24}" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${a}×${b} m</text>
  <text x="${x+a*s+c*s/2}" y="${base+24}" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${c}×${d} m</text></svg>`}

// ---------- MUNDO 1: sumas y restas ----------
const ADD=[

// ---- mapa ----
const lvKey=(w,l)=>w+'-'+l;
const passed=k=>(ST.stars[k]||0)>=1||!!(ST.cleared&&ST.cleared[k]);
function isOpen(w,l){if(w<=ST.unlock&&l===1)return true;if(w===1&&l===1)return true;if(w<ST.unlock)return true;const pw=l===1?w-1:w,pl=l===1?5:l-1;return passed(lvKey(pw,pl))}
function curLevel(){for(let w=1;w<=8;w++)for(let l=1;l<=5;l++)if(isOpen(w,l)&&!ST.stars[lvKey(w,l)])return [w,l];return [8,5]}
const SALUDOS=['¿Lista para pensar? 🧠','¡Hoy vamos a por más estrellas!','Recuerda: lee el problema dos veces 👀','Si te atascas, pide una pista 💡','¡Cada día un poquito mejor!'];
function vMap(){const [cw,cl]=curLevel();const retoHecho=ST.reto===today();
 let h=`<div class="hello">${avatar('m')}<div class="bubble">¡Hola, ${ST.name}! ${pick(SALUDOS)}</div></div>
 <button class="daily" onclick="startReto()"><span style="font-size:44px">${retoHecho?'✅':'🎁'}</span><span><span class="big">Reto del día</span><br><span style="font-weight:700">${retoHecho?'¡Hecho! Vuelve mañana para otro cofre':'5 problemas mezclados · cofre de +40 🪙'}</span></span></button>`;
 const nueva=fraseHoy();h+=`<button class="msgday" onclick="showFrase()"><span style="font-size:34px">💌</span><span><b>Mensaje de ${ST.firma||'Papá y Mamá'}</b><br><span class="small">«${ST.fraseTxt.length>60?ST.fraseTxt.slice(0,58)+'…':ST.fraseTxt}»</span></span></button>`;
 WORLDS.forEach((W,i)=>{const w=i+1,open=isOpen(w,1);const st=[1,2,3,4,5].reduce((a,l)=>a+(ST.stars[lvKey(w,l)]||0),0);
  h+=`<div class="world ${open?'':'locked'}" id="w${w}" style="background:linear-gradient(135deg,${W.g[0]},${W.g[1]})"><div class="wemo">${W.emo}</div>
  <div class="small" style="font-weight:800;opacity:.85">MUNDO ${w} · ⭐ ${st}/15</div><h2>${W.name}</h2><div class="wdesc">${W.desc}</div>${open?`<button class="wlearn" onclick="openLesson(${w})">📖 ¿Cuándo se hace cada cosa?</button>`:''}<div class="path">`;
  for(let l=1;l<=5;l++){const o=isOpen(w,l),s=ST.stars[lvKey(w,l)]||0,cur=w===cw&&l===cl;
   h+=`<button class="node ${l===5?'boss':''} ${o?'':'lock'} ${cur?'cur':''}" ${o?`onclick="nodeTap(${w},${l})"`:''} title="${W.lv[l-1]}">${o?(l===5?'👑':l):'🔒'}${o?`<span class="st">${'⭐'.repeat(s)}${'<span style="opacity:.35">☆</span>'.repeat(3-s)}</span>`:''}</button>`}
  h+=`</div></div>`});
 h+=`<p class="firma">Hecho con ❤️ por papá y mamá</p>`;
 $('#app').innerHTML=h;if(nueva)setTimeout(showFrase,450);
 const el=$('#w'+cw);if(el&&cw>1)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),150)}

// ---- juego ----
function startLevel(w,l){ST.seen=ST.seen||{};if(l===1&&!ST.seen[w]){openLesson(w,()=>startLevel(w,l));return}sfx('tap');G={mode:'lvl',w,l,probs:genLevel(w,l),i:0,res:[],hintsUsed:0};newProb();SCREEN='play';render();scrollTo(0,0)}
function startReto(){if(ST.reto===today()){toast('🎁','¡Ya hiciste el reto de hoy!','Vuelve mañana para un cofre nuevo. Mientras, puedes seguir en el mapa.');return}
 const open=[];for(let w=1;w<=8;w++)for(let l=1;l<=5;l++)if(isOpen(w,l))open.push([w,l]);const done=open.filter(([w,l])=>ST.stars[lvKey(w,l)]);const pool=done.length?done:open;
 const probs=[];for(let i=0;i<5;i++){const [w,l]=pick(pool);probs.push(genLevel(w,l,1)[0])}
 G={mode:'reto',probs,i:0,res:[],hintsUsed:0};newProb();SCREEN='play';render();scrollTo(0,0)}
function newProb(){const p=G.probs[G.i];G.phase=(p.op&&WORLDS[p.w-1].opPhase)?'op':'ans';G.tries=0;G.hint=0;G.input='';G.done=false;G.msg=null;G.opWrong=[];G.state='';G.picked=null;if(ST.voice)setTimeout(()=>speak(p.t+' '+p.q),300)}
const hlNums=t=>t.replace(/\d+(?:[:,.\/]\d+)?/g,m=>`<mark>${m}</mark>`);
const OPNAME={'+':'sumar','−':'restar','×':'multiplicar','÷':'dividir'};
const OKM=['¡Genial! 🎉','¡Lo has clavado! 🎯','¡Eres una crack! ⭐','¡Muy bien pensado! 🧠','¡Así se hace! 💪','¡Bravo! 👏','¡Toma ya! 🚀'];
const OK2=['¡Lo conseguiste! Eso es no rendirse 💪','¡Bien! A la segunda también vale 😄','¡Eso es! Revisar funciona 🔍'];
const KO1=['Casi... vuelve a mirar los números 👀','¡Uy! Si no sabes por qué, pulsa 🆘 «Me he atascado»','¡Ups! Inténtalo otra vez. Puedes pedir una pista 💡','Equivocarse también es aprender. ¡Otra vez!','Revisa la cuenta con calma, tú puedes 🙂'];
function vPlay(){const p=G.probs[G.i],W=WORLDS[p.w-1];
 const title=G.mode==='reto'?'🎁 Reto del día':`${W.emo} Mundo ${G.w} · ${W.lv[G.l-1]}`;
 const dots=G.probs.map((_,k)=>`<div class="dot ${k<G.res.length?(G.res[k]?'ok':'ko'):(k===G.i?'now':'')}"></div>`).join('');
 const step=G.done?4:(G.phase==='op'?3:(G.hint>=2?3:(G.hint>=1?2:1)));
 let h=`<div class="ptop"><button class="icbtn" style="background:var(--soft)" onclick="quitLevel()" aria-label="Salir">✖️</button><div class="dots">${dots}</div></div>
 <div class="lvtitle">${title}${G.mode==='reto'?` · <span class="tag">${W.emo} ${W.lv[p.l-1]}</span>`:''}</div>
 <div class="card"><button class="say" onclick="speak(G.probs[G.i].t+' '+G.probs[G.i].q)" aria-label="Leer en voz alta">🔊</button>
 <div class="prob ${G.hint>=2||G.done?'showdata':''}">${hlNums(p.t)}<span class="q ${G.hint>=1?'hl':''}">${p.q}</span></div>${p.fig?`<div class="fig">${p.fig}</div>`:''}
 <div class="steps4">${[['👀','Leo'],['🔎','Datos'],['🤔','Operación'],['✏️','Calculo']].map((s,k)=>`<div class="${k<step?'on':''}"><span>${s[0]}</span>${s[1]}</div>`).join('')}</div></div>`;
 // zona respuesta
 if(G.phase==='op'&&!G.done){h+=`<div class="card"><div class="big center" style="font-size:22px;margin-bottom:12px">¿Qué operación hay que hacer?</div><div class="ops">
  ${['+','−','×','÷'].map(o=>`<button class="op ${G.opWrong.includes(o)?'no':''}" onclick="pickOp('${o}')">${o}<small>${OPNAME[o]}</small></button>`).join('')}</div></div>`}
 else if(p.ch){h+=`<div class="card"><div class="choices">${p.ch.map(c=>`<button class="choice ${G.picked===c?G.state:''} ${G.done&&c===p.a?'yes':''}" ${G.done?'disabled':''} onclick="pickChoice(this.dataset.v)" data-v="${c}">${c}</button>`).join('')}</div></div>`}
 else{h+=`<div class="card">${G.opOk?`<div class="center mut small" style="font-weight:800;margin-bottom:6px">Has elegido <span class="tag">${p.op} ${OPNAME[p.op]}</span> ✅ Ahora calcula:</div>`:''}
  <div class="ansbox"><div class="disp ${G.state}" id="disp">${G.input||'<span style="opacity:.25">?</span>'}</div>${p.u?`<span class="unit">${p.u}</span>`:''}</div>
  ${G.done?'':`<div class="kp">${[7,8,9,4,5,6,1,2,3].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="key(',')">,</button><button onclick="key('0')">0</button><button onclick="key('del')">⌫</button></div>`}</div>`}
 // mensaje mascota
 if(G.msg)h+=`<div class="mascot"><span class="${G.msg.anim?'bounce':''}">${avatar('m')}</span><div class="bubble">${G.msg.t}</div></div>`;
 // pistas
 h+=`<div class="hints">${hintsHTML(p)}</div>`;
 if(G.done)h+=solHTML(p);
 // botones
 if(G.done&&!G.res[G.i])h+=`<div class="acts"><button class="btn sec" onclick="redoProb(false)">🔁 Repetir este</button><button class="btn sec" onclick="redoProb(true)">🎲 Otro parecido</button></div>`;
 if(G.done)h+=`<div class="acts"><button class="btn" onclick="nextProb()">${G.i<G.probs.length-1?'Siguiente ➜':'¡Ver resultado! 🏁'}</button></div>`;
 else h+=`<button class="stuckbtn" onclick="stuck()">🆘 Me he atascado, ¡ayuda!</button><div class="acts"><button class="btn sec" onclick="useHint()" ${G.hint>=4?'disabled':''}>💡 Pista ${G.hint<4?`(${G.hint}/4)`:''}</button>${G.phase==='ans'&&!p.ch?`<button class="btn" onclick="check()">Comprobar ✔</button>`:''}</div>`;
 $('#app').innerHTML=h}
function hintsHTML(p){let h='';
 if(G.hint>=1)h+=`<div class="hint"><b>Pista 1 · ¿Qué me preguntan?</b><br>${p.q} (la he marcado en amarillo).</div>`;
 if(G.hint>=2)h+=`<div class="hint"><b>Pista 2 · Los datos</b><br>Los números importantes están marcados: ${(p.t.match(/\d+(?:[:,.\/]\d+)?/g)||[]).map(x=>`<span class="tag">${x}</span>`).join(' ')}</div>`;
 if(G.hint>=3)h+=`<div class="hint"><b>Pista 3 · ¿Qué hago?</b><br>${p.p}</div>`;
 if(G.hint>=4){const c=p.c.slice(0,-1).map(x=>Array.isArray(x)?`${x[0]} = ${fmt2(x[1])}`:x);const last=p.c[p.c.length-1];if(Array.isArray(last))c.push(`${last[0]} = <b>?</b>`);h+=`<div class="hint"><b>Pista 4 · Las cuentas</b><div class="calc">${c.join('<br>')}</div></div>`}
 return h}
const fmt2=v=>typeof v==='number'?fmt(v):v;
const ansTxt=p=>typeof p.a==='number'?`${fmt(p.a)}${p.u?' '+p.u:''}`:p.a;
function solHTML(p){const ok=G.res[G.i];return `<div class="sol ${ok?'':'bad'}"><b>${ok?'✅ ¡Correcto!':'📘 Así se resuelve:'}</b><br>${p.p}<div class="calc" style="margin-top:6px">${p.c.map(x=>Array.isArray(x)?`${x[0]} = ${fmt2(x[1])}`:x).join('<br>')}</div><div style="margin-top:6px;font-weight:800">Respuesta: ${ansTxt(p)}</div></div>`}
function useHint(){if(G.hint>=4)return;G.hint++;G.hintsUsed++;ST.stats.hints++;save();sfx('tap');
 if(G.hint===3&&G.phase==='op'){/* la pista 3 revela la operación con su explicación */}
 vPlay();const hs=document.querySelectorAll('.hint');if(hs.length)hs[hs.length-1].scrollIntoView({behavior:'smooth',block:'center'});if(ST.voice&&G.hint===3)speak(G.probs[G.i].p)}
function pickOp(o){const p=G.probs[G.i];if(o===p.op){sfx('ok');G.phase='ans';G.opOk=true;G.msg={t:pick(['¡Bien elegido! Ahora haz la cuenta ✏️','¡Eso es! Toca calcular 🧮','¡Correcto! Vamos con la cuenta']),anim:true}}
 else{sfx('ko');G.opWrong.push(o);ST.stats.opErr++;save();G.msg={t:G.opWrong.length>=2?`Piensa: ${p.p} <br><a href="#" onclick="helpOp();return false">🆘 Ver la guía de operaciones</a>`:pick(['Mmm, no es esa. ¿Qué pasa en el problema: se junta, se quita, se repite o se reparte? 🤔','Vuelve a leer la pregunta con calma 👀']),anim:false}}
 vPlay()}
function key(k){if(G.done||G.phase!=='ans')return;sfx('tap');if(k==='del')G.input=G.input.slice(0,-1);else if(k===','){if(!G.input.includes(','))G.input+=(G.input?'':'0')+','}else if(G.input.length<9)G.input=(G.input==='0'?'':G.input)+k;G.state='';const d=$('#disp');if(d){d.innerHTML=G.input||'<span style="opacity:.25">?</span>';d.className='disp'}}
document.addEventListener('keydown',e=>{if(SCREEN!=='play'||!G||G.done)return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===','||e.key==='.')key(',');else if(e.key==='Backspace')key('del');else if(e.key==='Enter')check()});
function check(){const p=G.probs[G.i];if(!G.input){const d=$('#disp');if(d){d.classList.add('no');setTimeout(()=>d.classList.remove('no'),400)}return}
 const v=parseFloat(G.input.replace(',','.'));judge(Math.abs(v-p.a)<.005)}
function pickChoice(c){if(G.done)return;G.picked=c;judge(c===String(G.probs[G.i].a))}
function judge(ok){const p=G.probs[G.i];G.tries++;
 if(ok){G.state='yes';const coins=G.tries===1?(G.hint?7:10):5;finishProb(true,coins);G.msg={t:G.tries===1?pick(OKM):pick(OK2),anim:true};if(G.tries>1)ST.comeback++;sfx('ok');vPlay();coinFly(coins,$('.mascot'));if(G.tries===1&&!G.hint)confetti(40)}
 else if(G.tries<2){G.state='no';sfx('ko');G.msg={t:pick(KO1),anim:false};vPlay();setTimeout(()=>{G.input='';G.state='';G.picked=null;if(SCREEN==='play'&&!G.done)vPlay()},900)}
 else{G.state='no';sfx('ko');finishProb(false,1);G.msg={t:'No pasa nada. Mira cómo se hace y el siguiente te saldrá mejor 💜 (+1 🪙 por intentarlo)',anim:false};vPlay();setTimeout(()=>{const s=$('.sol');if(s)s.scrollIntoView({behavior:'smooth',block:'center'})},100)}}
function finishProb(ok,coins){const p=G.probs[G.i];G.done=true;G.res.push(ok);addCoins(coins);markDay();
 const s=ST.stats;s.done++;if(ok)s.ok++;if(ok&&G.tries===1)s.first++;const k=lvKey(p.w,p.l);s.lv[k]=s.lv[k]||{n:0,ok:0,f:0};s.lv[k].n++;if(ok)s.lv[k].ok++;if(ok&&G.tries===1)s.lv[k].f++;save();renderTop()}
function markDay(){const t=today();if(ST.lastDay===t)return;ST.streak=ST.lastDay===yesterday()?ST.streak+1:1;ST.maxStreak=Math.max(ST.maxStreak,ST.streak);ST.lastDay=t;if(!ST.days.includes(t))ST.days.push(t)}
function redoProb(nuevo){sfx('tap');const old=G.probs[G.i];if(nuevo){const p=genLevel(old.w,old.l,1)[0];G.probs[G.i]=p}G.res.pop();G.opOk=false;newProb();vPlay();scrollTo(0,0)}
function nodeTap(w,l){const k=lvKey(w,l),s=ST.stars[k]||0;if(!s){startLevel(w,l);return}sfx('tap');const W=WORLDS[w-1];
 modal(`<div style="font-size:50px">${W.emo}</div><h2>${W.lv[l-1]}</h2><div style="font-size:30px;margin:6px 0">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><p class="mut" style="font-weight:700">Mundo ${w} · nivel ${l}</p>
 <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" onclick="closeModal();startLevel(${w},${l})">▶ Jugar otra vez</button>
 <button class="btn sec" onclick="resetLevel(${w},${l})">🔄 Reiniciar (ponerlo como no hecho)</button><button class="btn sec" onclick="closeModal()">Cerrar</button></div>`)}
function resetLevel(w,l,silent){const k=lvKey(w,l);ST.cleared=ST.cleared||{};if(ST.stars[k])ST.cleared[k]=1;delete ST.stars[k];if(ST.stats.lv[k])delete ST.stats.lv[k];save();if(silent)return;closeModal();render();toast('🔄','Nivel reiniciado','Ahora está como no hecho. Los niveles siguientes siguen abiertos, ¡puedes volver a por las estrellas cuando quieras!')}
function nextProb(){sfx('tap');if(G.i<G.probs.length-1){G.i++;G.opOk=false;newProb();vPlay();scrollTo(0,0)}else endLevel()}
function quitLevel(){modal(`<div class="bigemo" style="animation:none">🤔</div><h2>¿Salir del nivel?</h2><p class="mut">Perderás lo que llevas de este nivel (las monedas ganadas te las quedas).</p><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" onclick="closeModal()">Seguir jugando</button>${G.mode==='lvl'?`<button class="btn sec" onclick="closeModal();startLevel(${G.w},${G.l})">🔄 Empezar este nivel de nuevo</button>`:''}<button class="btn sec" onclick="closeModal();go('map')">Salir al mapa</button></div>`)}

// ---- final ----
let END=null;
function endLevel(){const ok=G.res.filter(Boolean).length;const stars=ok>=5?3:ok===4?2:ok===3?1:0;let bonus=0;
 if(G.mode==='lvl'){const k=lvKey(G.w,G.l),old=ST.stars[k]||0;ST.paid=ST.paid||{};ST.cleared=ST.cleared||{};const pd=ST.paid[k]||0;if(stars>pd){bonus=(stars-pd)*20+(pd===0?10:0);ST.paid[k]=stars}if(stars>old)ST.stars[k]=stars;if(stars>0)ST.cleared[k]=1;if(stars>0&&G.hintsUsed===0)ST.noHint++}
 else{if(ST.reto!==today()){bonus=40;ST.reto=today();ST.retos++}}
 addCoins(bonus);save();END={ok,stars,bonus,mode:G.mode};SCREEN='end';render();
 const nuevos=checkAch();
 if(stars>0||G.mode==='reto'){sfx('win');confetti(stars===3?220:120)}
 if(nuevos.length)setTimeout(()=>showAch(nuevos,0),1600)}

function stuck(){sfx('tap');modal(`<div style="font-size:52px">🆘</div><h2>¿Dónde te has atascado?</h2><p class="mut" style="font-weight:700;margin-top:4px">Elige lo que te pasa y te ayudo con eso 💜</p>
 <div class="stuck">

 <button onclick="helpCalc()">✏️ <span><b>No sé hacer la cuenta</b><br><small>Sé la operación pero me lío al calcular</small></span></button>
 <button onclick="helpCheck()">😖 <span><b>Me sale mal y no sé por qué</b><br><small>He hecho algo pero no es correcto</small></span></button>
 </div><button class="btn sec" style="margin-top:12px" onclick="closeModal()">Cerrar</button>`)}
function helpBox(title,body){modal(`<h2 style="margin-bottom:10px">${title}</h2><div style="text-align:left;font-weight:600">${body}</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn sec" onclick="stuck()">⬅ Otra duda</button><button class="btn" onclick="closeModal();vPlay()">¡Ya lo pillo! 💪</button></div>`)}
function helpRead(){const p=G.probs[G.i];const nums=(p.t.match(/\d+(?:[:,.\/]\d+)?/g)||[]);G.hint=Math.max(G.hint,2);save();speak(p.t+' '+p.q);
 helpBox('😵‍💫 Vamos a entenderlo juntas',`<div class="lbox"><b>1. Te lo leo en voz alta</b> 🔊 (escúchalo con calma, o léelo tú dos veces).</div>
 <div class="lbox"><b>2. Lo que te preguntan es:</b><br><span class="tag" style="font-size:16px">${p.q}</span></div>
 <div class="lbox"><b>3. Los datos (números) que te dan:</b><br>${nums.map(x=>`<span class="tag" style="font-size:16px;margin-right:4px">${x}</span>`).join('')||'—'}</div>
 <div class="lbox"><b>4. Imagínalo como una peli 🎬</b><br>Cuéntate la historia con tus palabras. Hazte estas preguntas:<ul style="margin:6px 0 0;padding-left:20px"><li>¿Al final hay <b>más</b> o <b>menos</b> que al principio?</li><li>¿Se <b>repite</b> la misma cantidad varias veces?</li><li>¿Se <b>reparte</b> algo en partes iguales?</li></ul>Si quieres, dibújalo en un papel con palitos o bolitas.</div>`)}
function helpOp(){const p=G.probs[G.i];G.hint=Math.max(G.hint,3);save();
 const tree=`<div class="tree">
 <div><span class="opb">+</span><span>¿Se <b>juntan</b> cosas o te <b>dan más</b>? → <b>sumar</b></span></div>
 <div><span class="opb">−</span><span>¿Se <b>quita</b> algo, preguntan lo que <b>queda</b>, lo que <b>falta</b> o la <b>diferencia</b>? → <b>restar</b></span></div>
 <div><span class="opb">×</span><span>¿Hay <b>grupos iguales</b> que se repiten (cajas de…, cada uno…)? → <b>multiplicar</b></span></div>
 <div><span class="opb">÷</span><span>¿Tienes un <b>total</b> que se <b>reparte</b> o se hace en grupos? → <b>dividir</b></span></div></div>`;
 helpBox('🤔 ¿Qué operación?',`${tree}<div class="lbox why" style="margin-top:10px"><b>En este problema:</b><br>${p.p}</div><p class="small mut" style="margin-top:8px">📖 ¿Quieres repasar la explicación del mundo? <a href="#" onclick="closeModal();openLesson(${p.w},()=>{SCREEN='play';render()});return false">Ábrela aquí</a> (luego vuelves a este problema).</p>`)}
function howTo(expr){const m=/^([\d.,]+) ([+−×÷]) ([\d.,]+)$/.exec(expr);if(!m)return '';const pn=x=>parseFloat(x.replace(/\./g,'').replace(',','.'));const a=pn(m[1]),o=m[2],b=pn(m[3]);
 if(!Number.isInteger(a)||!Number.isInteger(b))return `<div class="small">💡 Hay comas: pasa a céntimos (×100), haz la cuenta sin coma y al final vuelve a poner la coma (÷100). Pon la coma debajo de la coma.</div>`;
 if(o==='+'&&b>=10){const t=b-b%10,u=b%10;return `<div class="small">💡 Por partes: primero ${a} + ${t} = ${a+t}${u?`, luego ${a+t} + ${u} = <b>?</b>`:''}. O en columna: unidades con unidades y, si pasa de 9, te llevas 1.</div>`}
 if(o==='−'&&b>=10){const t=b-b%10,u=b%10;return `<div class="small">💡 Por partes: primero ${a} − ${t} = ${a-t}${u?`, luego ${a-t} − ${u} = <b>?</b>`:''}. O cuenta hacia arriba: desde ${b} hasta ${a}, ¿cuánto hay?</div>`}
 if(o==='+'||o==='−')return `<div class="small">💡 Cuenta con los dedos o salta de ${o==='+'?'uno en uno hacia arriba':'uno en uno hacia abajo'} desde ${a}.</div>`;
 if(o==='×'){const [x,y]=a>=b?[a,b]:[b,a];if(x<=10)return `<div class="small">💡 Es la tabla del ${y}: ${[...Array(Math.min(x,4))].map((_,i)=>`${y}×${i+1}=${y*(i+1)}`).join(', ')}… sigue sumando ${y} hasta llegar a ${y}×${x}.</div>`;
  if(y<=10){const t=x-x%10,u=x%10;return `<div class="small">💡 Parte el número grande: ${t} × ${y} = ${t*y}${u?` y ${u} × ${y} = ${u*y}. Ahora suma los dos resultados.`:'.'}</div>`}
  return `<div class="small">💡 Multiplica en columna o parte el número en decenas y unidades.</div>`}
 if(o==='÷'){const q=a/b;if(Number.isInteger(q)&&q<=12)return `<div class="small">💡 Busca en la tabla del ${b} qué número da ${a}: ${b}×1=${b}, ${b}×2=${b*2}, ${b}×3=${b*3}… sigue hasta llegar a ${a}.</div>`;
  if(Number.isInteger(q)&&q>12){const big=b*10*Math.floor(q/10);return `<div class="small">💡 Parte el ${a} en trozos fáciles: ${big} ÷ ${b} = ${big/b}${a-big?` y ${a-big} ÷ ${b} = ${(a-big)/b}. Ahora suma los dos resultados.`:'.'}</div>`}
  return `<div class="small">💡 Busca el número de la tabla del ${b} que más se acerca a ${a} sin pasarse. Lo que falta hasta ${a} es lo que sobra.</div>`}
 return ''}
function helpCalc(){const p=G.probs[G.i];G.hint=Math.max(G.hint,4);save();
 const lines=p.c.map((x,k)=>{const last=k===p.c.length-1;if(!Array.isArray(x))return `<div class="lbox calc" style="font-size:18px">${x}</div>`;
  return `<div class="lbox"><div class="calc" style="font-size:20px">Paso ${k+1}: ${x[0]} = ${last?'<b>?</b>':fmt2(x[1])}</div>${howTo(x[0])}</div>`}).join('');
 helpBox('✏️ Vamos con las cuentas',`<p style="margin:0 0 8px">${p.c.length>1?'Este problema tiene varios pasos. Hazlos en orden:':'Esta es la cuenta que hay que hacer:'}</p>${lines}<p class="small mut">El último resultado es tu respuesta. ¡Escríbelo tú! ✍️</p>`)}
function helpCheck(){const p=G.probs[G.i];
 helpBox('😖 Vamos a buscar el fallo',`<div class="lbox"><b>1. ¿Has usado los números correctos?</b><br>Mira que no te hayas dejado ninguno ni hayas copiado uno mal.</div>
 <div class="lbox"><b>2. ¿Tiene sentido tu resultado?</b><br>Si en el problema se quita algo, el resultado tiene que ser <b>más pequeño</b>. Si se junta o se repite, <b>más grande</b>.</div>
 <div class="lbox"><b>3. Comprueba con la operación contraria 🔄</b><br>Si has sumado, resta para comprobar. Si has dividido, multiplica. Ejemplo: 24 ÷ 4 = 6 → 6 × 4 = 24 ✅</div>
 <div class="lbox"><b>4. ¿Has hecho todos los pasos?</b><br>${p.c.length>1?`Este problema tiene <b>${p.c.length} pasos</b>. ¡Quizá te falte alguno!`:'Este problema se resuelve con una sola cuenta.'}</div>
 ${p.u?`<div class="lbox"><b>5. Mira la unidad</b><br>La respuesta va en <span class="tag">${p.u}</span>.</div>`:''}`)}

// ---- logros ----
function vAch(){const n=Object.keys(ST.ach).length;$('#app').innerHTML=`<h1 class="h2">🏆 Mis logros</h1><p class="mut" style="font-weight:700">${n} de ${ACH.length} conseguidos · Racha máxima: ${ST.maxStreak} días 🔥</p>
 <div class="grid">${ACH.map(a=>`<div class="badge ${ST.ach[a[0]]?'':'off'}"><div class="i">${a[1]}</div><b>${a[2]}</b><p>${a[3]}</p></div>`).join('')}</div>`}

// ---- tienda ----
function vShop(){const tab=SHOPTAB;let items='';
 if(tab==='av')items=SHOP.av.map(([e,c])=>itemHTML('av',e,c,`<div class="i">${e}</div>`,ST.avatar===e)).join('');
 if(tab==='acc')items=SHOP.acc.map(([e,c,n])=>itemHTML('acc',e,c,`<div class="i">${e||'🚫'}</div>${n?`<div class="small mut">${n}</div>`:''}`,ST.acc===e)).join('');
 if(tab==='th')items=SHOP.th.map(([e,c,n,g])=>itemHTML('th',e,c,`<div class="sw" style="background:linear-gradient(135deg,${g})"></div><b>${n}</b>`,ST.theme===e)).join('');
 $('#app').innerHTML=`<h1 class="h2">🛍️ Tienda</h1><div class="hello">${avatar('l')}<div class="bubble">Tienes <b>${ST.coins} 🪙</b>. ¡Gana más resolviendo problemas!</div></div>
 <div class="tabs">${[['av','🐾 Compañeros'],['acc','🎩 Accesorios'],['th','🎨 Colores']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="SHOPTAB='${k}';vShop()">${t}</button>`).join('')}</div><div class="grid">${items}</div>`}
function itemHTML(cat,id,cost,inner,on){const own=ST.owned.includes(cat+':'+id)||ST.owned.includes(id)&&cat!=='acc'||cost===0;
 return `<div class="item">${inner}${on?`<button class="btn" disabled>✓ Puesto</button>`:own?`<button class="btn sec" onclick="equip('${cat}','${id}')">Ponerme</button>`:`<button class="btn gold" ${ST.coins<cost?'disabled':''} onclick="buy('${cat}','${id}',${cost})">${cost} 🪙</button>`}</div>`}
function equip(cat,id){sfx('tap');if(cat==='av')ST.avatar=id;if(cat==='acc')ST.acc=id;if(cat==='th')ST.theme=id;save();render()}
function buy(cat,id,cost){if(ST.coins<cost)return;ST.coins-=cost;ST.owned.push(cat+':'+id);ST.shopped++;equip(cat,id);sfx('win');confetti(70);const n=checkAch();if(n.length)setTimeout(()=>showAch(n,0),900)}

// ---- zona familia (padres) ----
function vParents(){if(!PARENT_OK){$('#app').innerHTML=`<div class="card center" style="margin-top:24px"><div class="bigemo" style="animation:none">👪</div><h2>Zona de la familia</h2>
  <p class="mut" style="font-weight:700">${ST.pin?'Introduce el PIN de 4 cifras.':'Primera vez: elige un PIN de 4 cifras para esta zona (solo para mayores).'}</p>
  <input class="txt" id="pin" inputmode="numeric" maxlength="4" style="text-align:center;letter-spacing:10px;max-width:200px" type="password"><br><br><button class="btn" onclick="pinOk()">Entrar</button><p class="small mut" id="pinmsg"></p></div>`;return}
 const s=ST.stats,pc=(a,b)=>b?Math.round(a/b*100):0;
 let rows='';WORLDS.forEach((W,i)=>{const w=i+1;let n=0,ok=0,f=0;for(let l=1;l<=5;l++){const x=s.lv[lvKey(w,l)];if(x){n+=x.n;ok+=x.ok;f+=x.f||0}}const st=[1,2,3,4,5].reduce((a,l)=>a+(ST.stars[lvKey(w,l)]||0),0);
  rows+=`<tr><td>${W.emo} ${W.name}</td><td>${st}/15</td><td>${n}</td><td><div class="bar"><i style="width:${pc(f,n)}%"></i></div><span class="small">${n?pc(f,n)+'%':'—'}</span></td></tr>`});
 const weak=Object.entries(s.lv).filter(([k,x])=>x.n>=4&&x.f/x.n<.6).sort((a,b)=>a[1].f/a[1].n-b[1].f/b[1].n).slice(0,5).map(([k,x])=>{const [w,l]=k.split('-').map(Number);return `<li><b>${WORLDS[w-1].emo} ${WORLDS[w-1].lv[l-1]}</b> (mundo ${w}) · ${pc(x.f,x.n)}% a la primera en ${x.n} problemas</li>`}).join('');
 const last7=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return `<span title="${k}" style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;margin-right:4px;font-size:12px;font-weight:800;background:${ST.days.includes(k)?'var(--ok)':'var(--line)'};color:${ST.days.includes(k)?'#fff':'var(--mut)'}">${'LMXJVSD'[(d.getDay()+6)%7]}</span>`}).join('');
 $('#app').innerHTML=`<h1 class="h2">👪 Zona de la familia</h1>
 <div class="card"><h3>Resumen de ${ST.name}</h3><table>
 <tr><td>Problemas hechos</td><td><b>${s.done}</b></td></tr><tr><td>Aciertos (contando segundo intento)</td><td><b>${pc(s.ok,s.done)}%</b></td></tr>
 <tr><td>Aciertos a la primera</td><td><b>${pc(s.first,s.done)}%</b></td></tr><tr><td>Pistas usadas</td><td><b>${s.hints}</b></td></tr>
 <tr><td>Fallos al elegir la operación</td><td><b>${s.opErr}</b></td></tr><tr><td>Días practicados</td><td><b>${ST.days.length}</b> · racha actual ${ST.streak} · máxima ${ST.maxStreak}</td></tr></table>
 <p style="margin:12px 0 4px;font-weight:800">Últimos 7 días</p>${last7}</div>
 <div class="card"><h3>Por mundos</h3><table><tr><th>Mundo</th><th>Estrellas</th><th>Problemas</th><th>A la primera</th></tr>${rows}</table></div>
 <div class="card"><h3>🔎 Dónde le cuesta más</h3>${weak?`<ul>${weak}</ul><p class="small mut">Sugerencia: repetir ese nivel juntos, leyendo el enunciado en voz alta y usando las pistas en orden.</p>`:'<p class="mut">Aún no hay datos suficientes (se muestra cuando lleva 4+ problemas en un nivel con menos del 60% a la primera).</p>'}</div>
 <div class="card"><h3>⚙️ Ajustes</h3>
 <p><label style="font-weight:700"><input type="checkbox" ${ST.voice?'checked':''} onchange="ST.voice=this.checked;save()"> Leer los problemas en voz alta automáticamente</label></p>
 <p><label style="font-weight:700"><input type="checkbox" ${ST.sound?'checked':''} onchange="ST.sound=this.checked;save();renderTop()"> Sonidos</label></p>
 <p style="font-weight:700;margin-bottom:4px">Abrir mundos directamente (si ya domina lo básico):</p>
 <div class="row"><select id="unl" class="txt" style="max-width:260px">${WORLDS.map((W,i)=>`<option value="${i+1}" ${ST.unlock===i+1?'selected':''}>Hasta el mundo ${i+1} · ${W.name}</option>`).join('')}</select><button class="btn sec" onclick="ST.unlock=+$('#unl').value;save();toast('🔓','Hecho','Los mundos hasta el '+ST.unlock+' están abiertos.')">Aplicar</button></div>
 <p style="font-weight:700;margin:14px 0 4px">Nombre</p><div class="row"><input class="txt" id="nm2" value="${ST.name}" maxlength="16" style="max-width:260px"><button class="btn sec" onclick="const v=$('#nm2').value.trim();if(v){ST.name=v;PLAYER=v;save();renderTop()}">Guardar</button></div></div>
 <div class="card"><h3>💾 Copia de seguridad</h3><p class="small mut">El progreso se guarda en este dispositivo. Para pasarlo a otra tablet o móvil, copia el código y pégalo allí.</p>
 <div class="row"><button class="btn sec" onclick="exportar()">Copiar código</button><button class="btn sec" onclick="importar()">Pegar código</button></div><textarea id="bk" class="txt" style="margin-top:10px;font-size:12px;height:80px;display:none"></textarea></div>
 <div class="card"><h3>💜 Consejos para acompañarla</h3><ul style="font-weight:600">
 <li>10–15 minutos al día funcionan mejor que una hora el fin de semana. La racha 🔥 la motiva a volver.</li>
 <li>Los 4 pasos (Leo → Datos → Operación → Calculo) son el método: pídele que te los diga en voz alta.</li>
 <li>Las pistas no quitan estrellas: usarlas es aprender. Valora el esfuerzo más que el acierto.</li>
 <li>Si un nivel se atasca, repetidlo juntos; los problemas cambian cada vez.</li></ul></div>
 <div class="card"><h3>💌 Frases de ánimo</h3><p class="small mut">Cada día, la primera vez que entra, le sale una de estas frases (por orden, una distinta cada día). Escribe una por línea; podéis cambiarlas, quitarlas o añadir las vuestras.</p>
 <p style="font-weight:700;margin:8px 0 4px">Firma</p><input class="txt" id="firma" value="${(ST.firma||'Papá y Mamá').replace(/"/g,'&quot;')}" maxlength="40">
 <p style="font-weight:700;margin:12px 0 4px">Mensaje especial para la próxima vez que entre (opcional)</p><input class="txt" id="esp" value="${(ST.especial||'').replace(/"/g,'&quot;')}" placeholder="Ej.: ¡Mucha suerte mañana en el examen!" maxlength="200">
 <p style="font-weight:700;margin:12px 0 4px">Frases (${(ST.frases&&ST.frases.length)||FRASES_DEF.length})</p><textarea id="frs" class="txt" style="height:200px;font-size:15px">${(ST.frases&&ST.frases.length?ST.frases:FRASES_DEF).join('\n')}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="guardarFrases()">Guardar</button><button class="btn sec" onclick="ST.frases=FRASES_DEF.slice();save();vParents()">Volver a las de serie</button><button class="btn sec" onclick="showFrase()">👀 Ver el de hoy</button></div></div>
 <div class="card"><h3>🔄 Reiniciar niveles</h3><p class="small mut">Pone el nivel (o el mundo entero) como no hecho: quita sus estrellas y sus estadísticas para empezarlo de cero. Lo que ya estaba abierto sigue abierto.</p>
 <div class="row"><select id="rsw" class="txt" style="max-width:240px">${WORLDS.map((W,i)=>`<option value="${i+1}">${W.emo} Mundo ${i+1}</option>`).join('')}</select>
 <select id="rsl" class="txt" style="max-width:220px"><option value="0">Todo el mundo</option>${[1,2,3,4,5].map(l=>`<option value="${l}">Nivel ${l}</option>`).join('')}</select>
 <button class="btn sec" onclick="const w=+$('#rsw').value,l=+$('#rsl').value;(l?[l]:[1,2,3,4,5]).forEach(x=>resetLevel(w,x,true));vParents();toast('🔄','Reiniciado',l?'Nivel '+l+' del mundo '+w+' como no hecho.':'Mundo '+w+' entero como no hecho.')">Reiniciar</button></div></div>
 <div class="card"><h3>Borrar todo</h3><p class="small mut">Empieza de cero (se pierde el progreso de este dispositivo).</p><button class="btn sec" style="color:var(--bad)" onclick="borrar()">Borrar progreso</button></div>
 <p class="center"><button class="btn sec" onclick="PARENT_OK=false;go('map')">🔒 Cerrar zona familia</button></p>`}
function guardarFrases(){const l=$('#frs').value.split('\n').map(x=>x.trim()).filter(Boolean);ST.frases=l.length?l:FRASES_DEF.slice();ST.firma=$('#firma').value.trim()||'Papá y Mamá';const e=$('#esp').value.trim();ST.especial=e;if(e&&ST.fraseDay===today()){ST.fraseDay=''}if(ST.fraseIdx>=ST.frases.length)ST.fraseIdx=-1;save();toast('💌','Guardado',e?'El mensaje especial le saldrá la próxima vez que abra el mapa.':'Las frases están guardadas.')}
function pinOk(){const v=$('#pin').value;if(!/^\d{4}$/.test(v)){$('#pinmsg').textContent='Tienen que ser 4 cifras.';return}if(!ST.pin){ST.pin=v;save();PARENT_OK=true;vParents();return}if(v===ST.pin){PARENT_OK=true;vParents()}else{$('#pinmsg').textContent='PIN incorrecto.';$('#pin').value=''}}
function exportar(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(ST))));const t=$('#bk');t.style.display='block';t.value=c;t.select();try{navigator.clipboard.writeText(c);toast('📋','Código copiado','Pégalo en el otro dispositivo, en Familia → Pegar código.')}catch(e){}}
function importar(){const t=$('#bk');if(t.style.display!=='block'||!t.value){t.style.display='block';t.value='';t.placeholder='Pega aquí el código y vuelve a pulsar «Pegar código»';t.focus();return}
 try{const o=JSON.parse(decodeURIComponent(escape(atob(t.value.trim()))));if(!o.stats)throw 0;ST=Object.assign(DEF(),o);PLAYER=ST.name;save();toast('✅','Progreso recuperado','¡Todo listo!');render()}catch(e){toast('⚠️','Código no válido','Revisa que esté copiado entero.')}}
function borrar(){modal(`<h2>¿Seguro?</h2><p class="mut">Se borran estrellas, monedas y logros de este dispositivo.</p><div class="row" style="justify-content:center"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" style="background:var(--bad)" onclick="localStorage.removeItem(KEY);location.reload()">Borrar</button></div>`)}

// ---- modales ----
function modal(html){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function toast(e,t,m){modal(`<div class="bigemo" style="animation:none">${e}</div><h2>${t}</h2><p class="mut" style="font-weight:700">${m}</p><button class="btn" onclick="closeModal()">Vale</button>`)}

addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});
try{speechSynthesis.getVoices()}catch(e){}
render();
</script>
</body>
</html>
